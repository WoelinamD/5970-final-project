<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mobile Note App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h2 class="text-center mb-4">📒 Mobile Note App</h2>

    <!-- Tabs -->
    <ul class="nav nav-tabs mb-3" id="noteTabs">
      <li class="nav-item">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#viewNotes">Notes</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#addNote">Add Note</button>
      </li>
    </ul>

    <!-- Tab content -->
    <div class="tab-content">
      <!-- Notes tab -->
      <div class="tab-pane fade show active" id="viewNotes">
        <div id="noteList" class="d-grid gap-3"></div>
      </div>

      <!-- Add Note tab -->
      <div class="tab-pane fade" id="addNote">
        <div class="mb-3">
          <label for="noteInput" class="form-label">New Note (one bullet per line)</label>
          <textarea id="noteInput" class="form-control" rows="5" placeholder="- Buy milk\n- Finish report"></textarea>
        </div>
        <button class="btn btn-success w-100" onclick="saveNote()">Save Note</button>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit Note</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <textarea id="editTextarea" class="form-control" rows="5"></textarea>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary" onclick="saveEdit()">Save Changes</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS + Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    let notes = JSON.parse(localStorage.getItem('notes')) || [];
    let currentEditIndex = null;

    function saveNote() {
      const text = document.getElementById('noteInput').value.trim();
      if (!text) return;
      const bullets = text.split('\n').map(line => line.trim()).filter(Boolean);
      notes.push(bullets);
      localStorage.setItem('notes', JSON.stringify(notes));
      document.getElementById('noteInput').value = '';
      showNotes();
      // Switch to Notes tab
      document.querySelector('[data-bs-target="#viewNotes"]').click();
    }

    function deleteNote(index) {
      notes.splice(index, 1);
      localStorage.setItem('notes', JSON.stringify(notes));
      showNotes();
    }

    function showNotes() {
      const noteList = document.getElementById('noteList');
      noteList.innerHTML = '';

      if (notes.length === 0) {
        noteList.innerHTML = '<p class="text-muted text-center">No notes available.</p>';
        return;
      }

      notes.forEach((note, idx) => {
        const card = document.createElement('div');
        card.className = 'card';

        const body = document.createElement('div');
        body.className = 'card-body';

        const ul = document.createElement('ul');
        ul.classList.add('mb-3');
        note.forEach(item => {
          const li = document.createElement('li');
          li.textContent = item;
          ul.appendChild(li);
        });

        const btnGroup = document.createElement('div');
        btnGroup.className = 'd-flex gap-2';

        const editBtn = document.createElement('button');
        editBtn.className = 'btn btn-sm btn-primary flex-fill';
        editBtn.textContent = 'Edit';
        editBtn.onclick = () => openEditModal(idx);

        const delBtn = document.createElement('button');
        delBtn.className = 'btn btn-sm btn-danger flex-fill';
        delBtn.textContent = 'Delete';
        delBtn.onclick = () => deleteNote(idx);

        btnGroup.appendChild(editBtn);
        btnGroup.appendChild(delBtn);
        body.appendChild(ul);
        body.appendChild(btnGroup);
        card.appendChild(body);
        noteList.appendChild(card);
      });
    }

    function openEditModal(index) {
      currentEditIndex = index;
      const note = notes[index];
      document.getElementById('editTextarea').value = note.join('\n');
      const editModal = new bootstrap.Modal(document.getElementById('editModal'));
      editModal.show();
    }

    function saveEdit() {
      const updatedText = document.getElementById('editTextarea').value.trim();
      if (updatedText === '') return;
      notes[currentEditIndex] = updatedText.split('\n').map(line => line.trim()).filter(Boolean);
      localStorage.setItem('notes', JSON.stringify(notes));
      showNotes();
      bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
    }

    showNotes();
  </script>
</body>
</html>
